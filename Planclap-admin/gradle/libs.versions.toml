[versions]
guava = "33.2.1-jre"
junit-jupiter = "5.10.3"
mockito = "5.19.0"
aspectj = "1.9.24"
gson = "2.13.2"
jopt = "5.0.4"
arch = "1.3.0"
freefair-aspectj = "8.14.2"
mysql="9.5.0"
sqlite="3.51.0.0"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
aspectj = { module = "org.aspectj:aspectjrt", version.ref = "aspectj" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jopt = { module = "net.sf.jopt-simple:jopt-simple", version.ref = "jopt" }
arch = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "arch" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
freefair-aspectj = { id = "io.freefair.aspectj", version.ref = "freefair-aspectj" }
